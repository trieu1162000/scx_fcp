<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Frame context carried from a root to synchronous helpers</title>
  <desc id="desc">A frame root wakes a UI thread, a render thread, SurfaceFlinger, and a helper. A bounded token follows the synchronous wake edges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#08519c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14213d">Frame context is carried across sleeps</text>
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="13" fill="#5b6577">One bounded token follows the synchronous edges a frame root actually wakes.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="180" height="92" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
    <rect x="60" y="130" width="180" height="8" rx="4" fill="#08519c"/>
    <text x="84" y="168" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14213d">Frame root</text>
    <text x="84" y="190" font-family="Arial, sans-serif" font-size="12" fill="#5b6577">behavioral admission</text>
    <text x="84" y="207" font-family="Arial, sans-serif" font-size="12" fill="#08519c">token epoch = t</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="110" width="190" height="82" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="364" y="144" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14213d">UIThread</text>
    <text x="364" y="165" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">select_cpu + enqueue</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="220" width="190" height="82" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="364" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14213d">RenderThread</text>
    <text x="364" y="275" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">synchronous wake</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="110" width="190" height="82" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="664" y="144" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14213d">SurfaceFlinger</text>
    <text x="664" y="165" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">same-TGID handoff</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="220" width="190" height="82" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="664" y="254" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14213d">Helper</text>
    <text x="664" y="275" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">inherits only on edge</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="165" width="210" height="82" rx="14" fill="#0b2d52" stroke="#0b2d52"/>
    <text x="954" y="199" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Critical DSQ</text>
    <text x="954" y="220" font-family="Arial, sans-serif" font-size="11" fill="#cfe3f7">idle big core / preempt</text>
  </g>

  <g stroke="#08519c" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M240 176 C280 176 300 151 340 151"/>
    <path d="M240 176 C280 176 300 261 340 261"/>
    <path d="M530 151 C575 151 600 151 640 151"/>
    <path d="M530 261 C575 261 600 261 640 261"/>
    <path d="M830 151 C875 151 890 196 930 196"/>
    <path d="M830 261 C875 261 890 216 930 216"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#08519c">
    <text x="265" y="128">wake</text>
    <text x="265" y="297">wake</text>
    <text x="560" y="128">wake</text>
    <text x="560" y="297">wake</text>
  </g>

  <text x="60" y="335" font-family="Arial, sans-serif" font-size="11" fill="#5b6577">Depth bound: 3 · expiry: one frame budget · same-TGID window: 1000 µs</text>
</svg>
