[package]
name = "scx_fcp"
version = "1.1.4"
authors = ["sched_ext Research Team"]
edition = "2024"
rust-version = "1.91"
description = "Frame Critical-Path & Thermal-Debt Heterogeneous sched_ext scheduler for Android big.LITTLE SoCs"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
libbpf-rs = "=0.27.2"
log = "0.4"
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }
